[project]
name = "icp-threat-intel"
version = "0.1.0"
description = "Threat intelligence and threat hunting for ICP canisters used as attack infrastructure."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "cbor2>=5.6",
    "httpx>=0.27",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "sqlalchemy>=2.0.30",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.scripts]
icp-threat-intel = "icp_threat_intel.cli.app:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icp_threat_intel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Python only: keep the formatter away from code blocks in Markdown docs (PLAN.md, SPEC.md).
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: needs a running Postgres server (deselected by make test)",
    "live: talks to live allowlisted hosts (only via make record)",
]
