services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: icp_threat_intel
      POSTGRES_DB: icp_threat_intel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icp_threat_intel -d icp_threat_intel"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      ICP_THREAT_INTEL_DATABASE_URL: postgresql+psycopg://icp_threat_intel:${POSTGRES_PASSWORD}@db:5432/icp_threat_intel
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python", "-m", "icp_threat_intel.scheduler"]

volumes:
  pgdata:
